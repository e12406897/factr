name:  "sim_left"  # options: sim/left/right (decides the zmq addresses used for follower/leader communication)

dynamixel:
  # USB port names given by the command: ls /dev/serial/by-id/
  # One entry per physically separate serial adapter.
  ports:
    - "usb-FTDI_USB__-__Serial_Converter_FT9HD80O-if00-port0"   # Port 2
    - "usb-FTDI_USB__-__Serial_Converter_FT9HDA6P-if00-port0"   # Port 3
  # Servo types
  servo_types: [
    "XL330_M288_T", "XM430_W350_T", "XL330_M288_T", "XM430_W350_T",
    "XL330_M288_T", "XL330_M288_T", "XL330_M288_T", "XL330_M288_T"
  ]
  # Servo joint directions to match that of the leader arm
  joint_signs: [1, -1, 1, -1, 1, -1, 1, -1]
  # Which port (index into `ports` above) Dynamixel ID i+1 is wired to, in the same
  # order as servo_types/joint_signs (arm joints 1-7, then gripper). Dynamixel IDs are
  # assumed to already be assigned 1..8 in this joint order across both ports.
  servo_port_index: [0, 1, 0, 1, 0, 0, 0, 0]
  
arm_teleop:
  # URDF used for creating leader arm dynamics model to compute gravity compensation
  leader_urdf: "factr_teleop_franka.urdf"
  num_arm_joints: 7
  # joint limits of Franka FR3
  arm_joint_limits_max: [2.3093, 1.5133, 2.4937, -0.4461, 2.4800, 4.2094, 2.6895]
  arm_joint_limits_min: [-2.3093, -1.5133, -2.4937, -2.7478, -2.4800, 0.8521, -2.6895]
  # # joint limits of Franka Panda
  # arm_joint_limits_max: [2.8973, 1.7628, 2.8973, -0.8698, 2.8973, 3.7525, 2.8973]
  # arm_joint_limits_min: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
  arm_joint_limits_safety_margin: 0.1
  # Correct steady offset (can be determined with launch/read_franka_q_offset.py)
  joint_bias_correction: [-0.0277,  0.0527, -0.0093, -0.0999, -0.011,   0.0181, 0.7602]
  initialization:
    # The expected leader arm joint position before launching the script
    calibration_joint_pos: [0, 0, 0, -1.57, 0, 1.57, 0.0]
    # The leader arm must be brought to this joint position before the follower starts mirroring the leader
    initial_match_joint_pos: [0.0, -0.5, 0.0, -2.0, 0, 1.57, 0.785]
  
controller:
  frequency: 500
  torque_feedback:
    enable: True
    gain: [0.5, 0.1, 0.4, 0.3, 0.15, 0.3, 0.2]
    damping: 0
    motor_scalar: [87, 87, 87, 87, 12, 12, 12] 
  gravity_comp:
    enable: True
    gain: [0.5, 0.18, 0.4, 0.18, 0.5, 0.5, 0.5] 
  null_space_regulation:
    null_space_joint_target: [0.0, -0.7854, 0.0, -2.356, 0.0, 1.57, 0.0, 0.0]
    kp:  [0.4, 0.1, 0.2, 0.1, 0.2, 0.2, 0.2]
    kd:  [0.02, 0.05, 0.02, 0.045, 0.02, 0.02, 0.02]
  null_space_torque_optimization:
    enable: True
    #parameters for null space torque optimization
    weight_external_forces: [0.01, 0.01, 1.0, 0.01, 0.01, 0.01]
    gain_force: [0.5, 0.8, 0.5, 0.8, 0.2, 0.2, 0.2]
    gain_moment: [0.1, 0.15, 0.1, 0.15, 0.05, 0.05, 0.05]
    #parameter damping
    damping: [0.04, 0.05, 0.04, 0.045, 0.05, 0.02, 0.02]
    # #parameter joint limit avoidance
    # avoid_limit_param_a: [10, 10, 10, 9, 4, 6.1, 3.7]
    # avoid_limit_param_b: [-23, -15, -25, -10, -10, -10, -10]
    # avoid_limit_gain: 0.0
    #paramter manipulability
    manip_gain: [0.2, 0.2, 0.3, 0.2, 0.15, 0.15, 0.15]
  static_friction_comp:
    enable_speed: 2
    gain: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05] 
  joint_limit_barrier:
    kp: 1.03561658022
    kd: 0.04315069084
  joint_position_control:
    interpolation_step_size: 0.5
    kp: 1.03561658022
    kd: 0.04315069084

  gripper_feedback:
    enable: False
    gain: 4
    ema_beta: 0.95

gripper_teleop:
  # The maximum range (in rad) of the leader gripper trigger
  actuation_range: 0.15